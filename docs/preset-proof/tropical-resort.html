<!doctype html>
<html><head><meta charset="utf-8"/><title>tropical-resort</title>
<style>
  body{margin:0;font-family:Georgia,serif;background:#F4F7FB;color:#0A2E5C}
  .hero{height:70vh;background:linear-gradient(135deg,#0A2E5C,#0A6CDE);display:flex;flex-direction:column;justify-content:flex-end;padding:48px;color:#fff}
  .name{font-size:42px;letter-spacing:.06em}
  .tag{margin-top:8px;opacity:.85;font-family:system-ui;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#E8A93D}
  .swatches{display:flex;gap:12px;padding:24px 48px}
  .sw{width:72px;height:72px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  .label{padding:0 48px 32px;font-family:system-ui;font-size:13px;color:#5E6B7E}
</style></head>
<body>
  <div class="hero"><div class="name">THE TEAK HOUSE</div><div class="tag">Riverside Boutique Hotel · Bangkok</div></div>
  <div class="swatches">
    <div class="sw" style="background:#0A2E5C"></div>
    <div class="sw" style="background:#0A6CDE"></div>
    <div class="sw" style="background:#FF6B4A"></div>
    <div class="sw" style="background:#E8A93D"></div>
    <div class="sw" style="background:#F4F7FB;border:1px solid #ddd"></div>
  </div>
  <div class="label">Preset proof · tropical-resort · switch via config/hotel.config.ts</div>
</body></html>
