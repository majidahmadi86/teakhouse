<!doctype html>
<html><head><meta charset="utf-8"/><title>minimal-zen</title>
<style>
  body{margin:0;font-family:Georgia,serif;background:#F2F2EE;color:#2A2A28}
  .hero{height:70vh;background:linear-gradient(135deg,#2A2A28,#4A5D4E);display:flex;flex-direction:column;justify-content:flex-end;padding:48px;color:#fff}
  .name{font-size:42px;letter-spacing:.06em}
  .tag{margin-top:8px;opacity:.85;font-family:system-ui;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#A89070}
  .swatches{display:flex;gap:12px;padding:24px 48px}
  .sw{width:72px;height:72px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  .label{padding:0 48px 32px;font-family:system-ui;font-size:13px;color:#5E6B7E}
</style></head>
<body>
  <div class="hero"><div class="name">QUIET HOUSE</div><div class="tag">Minimal Stay · Chiang Mai</div></div>
  <div class="swatches">
    <div class="sw" style="background:#2A2A28"></div>
    <div class="sw" style="background:#4A5D4E"></div>
    <div class="sw" style="background:#8B7355"></div>
    <div class="sw" style="background:#A89070"></div>
    <div class="sw" style="background:#F2F2EE;border:1px solid #ddd"></div>
  </div>
  <div class="label">Preset proof · minimal-zen · switch via config/hotel.config.ts</div>
</body></html>
