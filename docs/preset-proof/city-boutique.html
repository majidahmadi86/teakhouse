<!doctype html>
<html><head><meta charset="utf-8"/><title>city-boutique</title>
<style>
  body{margin:0;font-family:Georgia,serif;background:#F7F5F2;color:#2C1810}
  .hero{height:70vh;background:linear-gradient(135deg,#2C1810,#8B4513);display:flex;flex-direction:column;justify-content:flex-end;padding:48px;color:#fff}
  .name{font-size:42px;letter-spacing:.06em}
  .tag{margin-top:8px;opacity:.85;font-family:system-ui;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#C4A35A}
  .swatches{display:flex;gap:12px;padding:24px 48px}
  .sw{width:72px;height:72px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  .label{padding:0 48px 32px;font-family:system-ui;font-size:13px;color:#5E6B7E}
</style></head>
<body>
  <div class="hero"><div class="name">MAISON LANE</div><div class="tag">Design Hotel · Silom</div></div>
  <div class="swatches">
    <div class="sw" style="background:#2C1810"></div>
    <div class="sw" style="background:#8B4513"></div>
    <div class="sw" style="background:#C45C26"></div>
    <div class="sw" style="background:#C4A35A"></div>
    <div class="sw" style="background:#F7F5F2;border:1px solid #ddd"></div>
  </div>
  <div class="label">Preset proof · city-boutique · switch via config/hotel.config.ts</div>
</body></html>
